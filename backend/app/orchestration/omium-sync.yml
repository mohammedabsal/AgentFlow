name: Sync Omium Project

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Omium CLI
        run: pip install omium

      - name: Sync to Omium Dashboard
        env:
          OMIUM_API_KEY: ${{ secrets.OMIUM_API_KEY }}
        run: omium sync